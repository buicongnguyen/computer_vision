name: Course quality

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Go for actionlint
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Install Python test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate the course site
        run: python tools/validate_site.py

      - name: Validate learning materials
        run: python tools/validate_materials.py

      - name: Run Python tests from the console entry point
        run: pytest -q

      - name: Run Python tests as a module
        run: python -m pytest -q

      - name: Lint Python
        run: ruff check .

      - name: Install browser test dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Run browser tests
        run: npm test

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
