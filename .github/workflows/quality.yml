name: Course quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate the course site
        run: python tools/validate_site.py

      - name: Validate learning materials
        run: python tools/validate_materials.py

      - name: Run Python tests
        run: pytest -q

      - name: Lint Python
        run: ruff check .
