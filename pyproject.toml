[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "senior-cv-prep"
version = "0.1.0"
description = "Executable labs for senior computer vision engineering preparation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]
vision = [
  "opencv-python>=4.9,<5",
  "Pillow>=10,<12",
  "matplotlib>=3.8,<4",
  "pandas>=2.2,<3",
  "scikit-learn>=1.4,<2",
]

[tool.setuptools]
packages = ["labs", "labs.reference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 88
target-version = "py310"

